<!DOCTYPE html>
<html>
<head>
    <title>Image Search</title>
</head>
<body>
    <h1>Image Search Engine</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Enter your query..." required>
        <button type="submit">Search</button>
    </form>

    {% if results %}
    <h2>Results:</h2>
    <div style="display: flex; flex-wrap: wrap;">
        {% for path, score in results %}
        <div style="margin: 10px; text-align: center;">
            <a href="{{ path }}" target="_blank">
                <!-- <img src="{{ path | safe }}" width="200"> -->
                <iframe src="https://drive.google.com/file/d/{{ path }}/preview" width="200" height="150"></iframe>
              </a>

            <!-- <img src="{{ path | safe }}" width="200"><br> -->
            <!-- <small>{{ path.split('/')[-1] }}</small><br> -->
            <!-- <small>Score: {{ "%.2f"|format(score) }}</small> -->
        </div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
